name: checks

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m playwright install --with-deps chromium
      - name: Lint
        run: ruff check courtroom tests scripts
      - name: Tests (no key, no model, no network needed)
        run: python -m pytest -q
      - name: JavaScript syntax
        run: for f in courtroom/viz/web/*.js; do node --check "$f" || exit 1; done
      - name: Lab maths against the Python
        run: node scripts/check_lab_math.cjs
      - name: Generated docs are up to date
        run: python scripts/render_docs.py --check
      - name: Pinned spoken lines unchanged
        run: node scripts/collect_lines.cjs | diff - tests/golden/lines_baseline.json
      - name: Preflight (server starts, every endpoint answers, every case plays)
        run: python scripts/preflight.py --quick
