[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "saul-goodman-courtroom"
version = "1.0.0"
description = "Strategic AI agents in a simulated courtroom: deterministic judge, game-theoretic analysis, live visualisation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic==2.13.5",
    "rich==15.0.0",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1", "ruff>=0.5,<1", "pyright>=1.1.380,<2", "playwright>=1.45,<2"]
submission = ["python-pptx==1.0.2", "matplotlib==3.11.1"]  # slides and report figures; the report also needs the tectonic LaTeX engine, the PDF export of the slides needs LibreOffice

[project.scripts]
courtroom = "courtroom.cli:main"

[tool.setuptools.packages.find]
include = ["courtroom*"]

[tool.setuptools.package-data]
"courtroom.viz" = ["web/*", "web/data/*", "web/voices/*", "web/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: long-running Monte-Carlo tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B905"]

[tool.pyright]
include = ["courtroom"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
